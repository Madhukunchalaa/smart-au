<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Section</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            padding: 50px 20px;
        }

        .team-section {
            text-align: center;
            margin: 0 auto;
        }

        .section-subtitle {
            color: #999;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 48px;
            font-weight: 700;
            color: #333;
            line-height: 1.2;
            margin-bottom: 80px;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            justify-items: center;
        }

        .team-member {
            position: relative;
            text-align: center;
            transition: all 0.3s ease;
        }

        .member-image-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
            overflow: visible;
        }

        .image-background {
            position: absolute;
            width: 320px;
            height: 320px;
            background-color: rgba(255, 182, 193, 0.3);
            border-radius: 50%;
            top: -20px;
            left: -20px;
            z-index: 0;
        }
        .image-background {
    position: absolute;
    width: 320px;
    height: 320px;
    background-color: rgba(255, 182, 193, 0.3);
    border-radius: 50%;
    top: -20px;
    left: -20px;
    z-index: 0;

    /* make it half circle */
    clip-path: inset(0 0 50% 0);
    transition: background-color 0.3s ease;
}

.team-member:hover .image-background {
    background-color: #ff4757; /* new color on hover */
    
}


        .member-image {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            transition: all 0.3s ease;
            border: 5px solid transparent;
            z-index: 2;
        }

        .social-icons {
            position: absolute;
            bottom: 100px;
            left: 0px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2;
            opacity: 0;
        }

        .team-member:hover .social-icons {
            opacity: 1;
        }

        .social-links {
            display: flex;
            background-color: #ff4757;
            border-radius:30px ;
            gap: 0px;
            list-style: none;
            bottom: 77px;
            transform-origin: left;
            margin: 0;
            padding: 0;
        }

        .social-links li a {
            width:40px;
            height: 40px;
            background-color: #ff4757;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
        }


        .share-icon {
            position: absolute;
            top: 65%;
            left: -10px;
            width: 35px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            transform: translateY(-50%);
            transition: all 500ms ease;
            z-index: 3;
        }

        .member-image-container:hover ~ .share-icon {
            background-color: #ff3742;
            opacity: 0!important;
            transform: translateY(-50%) scale(1.1);
        }

        .member-name {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .member-position {
            font-size: 16px;
            color: #999;
            font-weight: 400;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .section-title {
                font-size: 36px;
                margin-bottom: 60px;
            }

            .team-grid {
                gap: 40px;
            }

            .social-icons{
                bottom: 40px!important;
            }

            .member-image-container {
                width: 220px;
                height: 220px;
            }

            .image-background {
                width: 260px;
                height: 260px;
            }
        }
        /* By default, show share icon, hide social icons */
.social-icons {
    position: absolute;
    bottom: 77px;
    left: -19px;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 2;
    pointer-events: none; /* prevent accidental hover when hidden */
}

.share-icon {
    position: absolute;
    top: 65%;
    left: -10px;
    width: 35px;
    height: 35px;
    background-color: #ff4757;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 3;
}

/* On hover - hide share icon */
.team-member:hover .share-icon {
    opacity: 0;
    pointer-events: none;
}

/* On hover - show social icons */
.team-member:hover .social-icons {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

    </style>
</head>
<body>
    <div class="container-fluid team-section">
        <div class="section-subtitle">OUR TEAM</div>
        <h2 class="section-title">What Success Looks<br>From The Back</h2>
        
        <div class="container-fluid team-grid">
            <div class="team-member">
                <div class="member-image-container">
                    <div class="image-background"></div>
                    <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=400&h=400&fit=crop&crop=face" alt="Ronald Richards" class="member-image">
                    <div class="social-icons">
                        <ul class="social-links">
                            <li><a aria-label="facebook" href="#"><i class="fab fa-facebook"></i></a></li>
                            <li><a aria-label="twitter" href="#"><i class="fab fa-twitter"></i></a></li>
                            <li><a aria-label="instagram" href="#"><i class="fab fa-instagram"></i></a></li>
                        </ul>
                    </div>
                    <div class="share-icon"><i class="fa-solid fa-share-nodes"></i></div>
                </div>
                <h3 class="member-name">Ronald Richards</h3>
                <p class="member-position">CEO & Founder</p>
            </div>

            <div class="team-member">
                <div class="member-image-container">
                    <div class="image-background"></div>
                    <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=400&h=400&fit=crop&crop=face" alt="Sarah Wilson" class="member-image">
                    <div class="social-icons">
                        <ul class="social-links">
                            <li><a aria-label="facebook" href="#"><i class="fab fa-facebook"></i></a></li>
                            <li><a aria-label="twitter" href="#"><i class="fab fa-twitter"></i></a></li>
                            <li><a aria-label="instagram" href="#"><i class="fab fa-instagram"></i></a></li>
                        </ul>
                    </div>
                    <div class="share-icon"><i class="fa-solid fa-share-nodes"></i></div>
                </div>
                <h3 class="member-name">Sarah Wilson</h3>
                <p class="member-position">CEO & Founder</p>
            </div>

            <div class="team-member">
                <div class="member-image-container">
                    <div class="image-background"></div>
                    <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=400&h=400&fit=crop&crop=face" alt="Michael Chen" class="member-image">
                    <div class="social-icons">
                        <ul class="social-links">
                            <li><a aria-label="facebook" href="#"><i class="fab fa-facebook"></i></a></li>
                            <li><a aria-label="twitter" href="#"><i class="fab fa-twitter"></i></a></li>
                            <li><a aria-label="instagram" href="#"><i class="fab fa-instagram"></i></a></li>
                        </ul>
                    </div>
                    <div class="share-icon"><i class="fa-solid fa-share-nodes"></i></div>
                </div>
                <h3 class="member-name">Michael Chen</h3>
                <p class="member-position">CEO & Founder</p>
            </div>

            <div class="team-member">
                <div class="member-image-container">
                    <div class="image-background"></div>
                    <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=400&h=400&fit=crop&crop=face" alt="Emma Thompson" class="member-image">
                    <div class="social-icons">
                        <ul class="social-links">
                            <li><a aria-label="facebook" href="#"><i class="fab fa-facebook"></i></a></li>
                            <li><a aria-label="twitter" href="#"><i class="fab fa-twitter"></i></a></li>
                            <li><a aria-label="instagram" href="#"><i class="fab fa-instagram"></i></a></li>
                        </ul>
                    </div>
                    <div class="share-icon"><i class="fa-solid fa-share-nodes"></i></div>
                </div>
                <h3 class="member-name">Emma Thompson</h3>
                <p class="member-position">CEO & Founder</p>
            </div>
        </div>
    </div>
</body>
</html>
